[package]
name = "codey-plugin-sdk"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
arc-swap = "1"
libloading = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
