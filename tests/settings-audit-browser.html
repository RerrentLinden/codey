<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>设置流程与首屏验证</title>
  <label>模拟响应
    <select id="fixture-state">
      <option value="normal">正常</option>
      <option value="plugins-error">插件读取失败</option>
      <option value="accounts-empty">账号为空</option>
      <option value="accounts-invalid">账号格式错误</option>
    </select>
  </label>
  <pre id="audit-metrics" style="font:12px monospace;white-space:pre-wrap"></pre>
  <div id="root"></div>
  <script type="module">
    import React, { Profiler } from "react";
    import { createRoot } from "react-dom/client";
    import { UiProvider } from "../src/UiProvider.tsx";
    import { App } from "../src/App.tsx";
    import "../src/dev/mockApi";
    import "../src/tailwind.css";
    import "../src/styles.css";
    import "../src/styles.operations.css";
    import "../src/styles.models.css";
    import "../src/styles.features.css";
    import "../src/styles.diagnostics.css";
    import "../src/styles.responsive.css";

    // 独立的模拟数据验证页，不调用真实桥接或记录请求参数。
    const mock = window.__codeyInvokeApi;
    const output = document.getElementById("audit-metrics");
    const fixture = document.getElementById("fixture-state");
    fixture.value = new URLSearchParams(location.search).get("fault") || "normal";
    const metrics = { calls: {}, renderMs: 0, initial: null, errors: [] };
    const publish = () => { output.textContent = JSON.stringify(metrics); };
    addEventListener("error", event => { metrics.errors.push(event.message); publish(); });
    addEventListener("unhandledrejection", event => { metrics.errors.push(String(event.reason)); publish(); });
    let pending = 0;
    window.__codeyInvokeApi = async (command, args) => {
      metrics.calls[command] = (metrics.calls[command] || 0) + 1;
      pending += 1;
      publish();
      try {
        if (command === "list_codey_plugins" && fixture.value === "plugins-error") throw new Error("模拟网络中断");
        if (command === "list_official_accounts" && fixture.value === "accounts-empty") return { accounts: [] };
        if (command === "list_official_accounts" && fixture.value === "accounts-invalid") return { accounts: "invalid" };
        return await mock(command, args);
      } finally { pending -= 1; publish(); }
    };
    const started = performance.now();
    createRoot(document.getElementById("root")).render(
      React.createElement(Profiler, { id: "settings", onRender(_id, _phase, duration) {
        metrics.renderMs += duration;
        publish();
      } }, React.createElement(UiProvider, null, React.createElement(App))),
    );
    const deadline = started + 10_000;
    while (!document.querySelector(".settings-layout") || pending > 0) {
      if (performance.now() > deadline) throw new Error("设置首屏加载超时");
      await new Promise(requestAnimationFrame);
    }
    await new Promise(requestAnimationFrame);
    await new Promise(requestAnimationFrame);
    metrics.initial = {
      readyMs: Math.round((performance.now() - started) * 100) / 100,
      renderMs: Math.round(metrics.renderMs * 100) / 100,
      nodes: document.getElementById("root").querySelectorAll("*").length,
      calls: { ...metrics.calls },
    };
    publish();
  </script>
</html>
